name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Download test browser (skipped when cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Browser system packages (retries if the network blips)
        run: |
          n=0
          until npx playwright install-deps chromium; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1; sleep 20
          done
      - run: node tests/run-all.js
