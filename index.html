<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Cabinet</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9a6b1f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<header class="topbar">
  <button class="brand" data-go="home" aria-label="Home">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>Coin Cabinet</span>
  </button>
  <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>
<nav class="menu" id="menu" hidden>
  <button data-go="home">Home</button>
  <button data-go="value">Coin Value</button>
  <button data-go="albums">Albums</button>
  <button data-go="wants">Want List</button>
  <button data-go="coins">Your Coins</button>
  <button data-go="guide">PCGS Photo Guide</button>
  <button data-act="openReport">Insurance Report</button>
  <button data-go="options">Options</button>
</nav>
<div id="banner" class="banner" hidden></div>
<main id="view" aria-live="polite"></main>
<button class="fab" id="fab" aria-label="Add coin">+</button>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="catalog/data.js"></script>
<script src="catalog/pricebook.js"></script>
<script src="catalog/albums.js"></script>
<script src="app.js"></script>
<script src="sheets.js"></script>
<script src="photofill.js"></script>
<script src="history.js"></script>
<script src="wants.js"></script>
<script src="report.js"></script>
<script src="snapshot.js"></script>
<script src="albumdb.js"></script>
<script src="local.js"></script>
<script src="backup.js"></script>
<script src="pwa.js"></script>
</body>
</html>
